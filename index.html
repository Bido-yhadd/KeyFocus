<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key Focused</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-panel" aria-labelledby="appTitle">
        <div class="hero-copy">
          <h1 id="appTitle">Key Focused</h1>
        </div>

        <form id="launchForm" class="launch-form" novalidate>
          <label for="emailInput">
            <span>Email</span>
            <input
              id="emailInput"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </label>

          <p id="formError" class="form-error" role="alert"></p>

          <button id="confirmButton" class="primary-button" type="submit" disabled>
            Preparing
          </button>
        </form>
      </section>

      <section id="sessionPanel" class="session-panel is-locked" aria-label="Focus session">
        <div class="camera-stage" aria-hidden="true">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div class="status-panel" id="statusPanel">
            <div class="status-topline">
              <span id="stateDot" class="state-dot idle"></span>
              <span id="statusText">Loading model</span>
            </div>
            <div id="reasonText" class="reason-text">Confirm your details to start.</div>
          </div>
        </div>

        <section class="game-stage" aria-label="Look-away game">
          <div id="gameRoot" class="game-root"></div>
        </section>
      </section>
    </main>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
