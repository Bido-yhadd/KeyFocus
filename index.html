<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Look Away Detector</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="camera-stage" aria-label="Webcam look-away classifier">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="status-panel" id="statusPanel">
          <div class="status-topline">
            <span id="stateDot" class="state-dot idle"></span>
            <span id="statusText">Loading model</span>
          </div>
          <div id="reasonText" class="reason-text">Allow camera access when prompted.</div>
        </div>
      </section>

      <aside class="controls" aria-label="Detector controls">
        <div>
          <h1>Look Away Detector</h1>
          <p>
            Webcam-based head and eye direction classifier using MediaPipe Face Landmarker.
          </p>
        </div>

        <button id="startButton" class="primary-button" type="button" disabled>
          Start webcam
        </button>

        <div class="metric-grid">
          <div class="metric">
            <span>Head yaw</span>
            <strong id="yawValue">0.00</strong>
          </div>
          <div class="metric">
            <span>Eye gaze</span>
            <strong id="gazeValue">0.00</strong>
          </div>
          <div class="metric">
            <span>Pitch</span>
            <strong id="pitchValue">0.00</strong>
          </div>
          <div class="metric">
            <span>Confidence</span>
            <strong id="confidenceValue">0%</strong>
          </div>
        </div>

        <label class="control-row">
          <span>Head sensitivity</span>
          <input id="headThreshold" type="range" min="0.10" max="0.35" value="0.18" step="0.01" />
          <output id="headThresholdValue">0.18</output>
        </label>

        <label class="control-row">
          <span>Eye sensitivity</span>
          <input id="eyeThreshold" type="range" min="0.12" max="0.42" value="0.24" step="0.01" />
          <output id="eyeThresholdValue">0.24</output>
        </label>

        <label class="control-row">
          <span>Debounce frames</span>
          <input id="debounceFrames" type="range" min="1" max="12" value="4" step="1" />
          <output id="debounceFramesValue">4</output>
        </label>

        <div class="event-log" aria-live="polite">
          <div class="event-log-title">Events</div>
          <ol id="eventLog"></ol>
        </div>
      </aside>
    </main>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
